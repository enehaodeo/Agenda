<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日程 · 手工排程</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
<script>
/* 深浅皮要在首帧之前定下来，否则夜里开页面会先白闪一下。
   app.js 在 body 末尾，来不及，所以这一小段留在这。
   逻辑与 app.js「主题」区同源：agenda.theme.v1 存 auto / light / dark。 */
(function () {
  var mode = 'auto';
  try { mode = localStorage.getItem('agenda.theme.v1') || 'auto'; } catch (e) { }
  var sys = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme =
    (mode === 'dark' || (mode !== 'light' && sys)) ? 'dark' : 'light';
})();
</script>
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="masthead">
  <div class="brand">
    <div class="seal" aria-hidden="true">程</div>
    <div class="brand-text">
      <h1>日程</h1>
      <p class="kicker">AGENDA · 手工排程</p>
    </div>
  </div>

  <div class="today">
    <div class="today-date" id="todayDate">—</div>
    <div class="today-clock" id="todayClock">--:--:--</div>
  </div>

  <div class="mast-actions">
    <button class="ghost-btn" id="btnTheme" title="切换外观">随系统</button>
    <button class="ghost-btn" id="btnUndo" title="撤销 (Ctrl+Z)">撤销</button>
    <button class="ghost-btn" id="btnExportDoc" title="导出为编排好的文档，可选日期范围">文档</button>
    <button class="ghost-btn" id="btnExport" title="导出为 JSON 备份">导出</button>
    <button class="ghost-btn" id="btnImport" title="从 JSON 备份恢复">导入</button>
    <button class="ghost-btn" id="btnTour" title="重看功能导览">导览</button>
    <button class="ghost-btn acct-btn" id="btnAcct" title="登录后可在多台设备之间同步">登录</button>
    <input type="file" id="fileImport" accept="application/json,.json" hidden>
  </div>
</header>

<main class="layout">

  <!-- ─────────────── 左栏：任务池 ─────────────── -->
  <aside class="col col-tasks">

    <section class="panel compose">
      <h2 class="panel-title">新建任务</h2>
      <input type="text" id="newTitle" class="compose-title" placeholder="要做什么？" autocomplete="off">
      <div class="compose-row">
        <div class="dur-input">
          <input type="number" id="newH" min="0" max="23" step="1" value="0" aria-label="小时"><span class="unit">时</span>
          <input type="number" id="newM" min="0" max="59" step="1" value="30" aria-label="分钟"><span class="unit">分</span>
        </div>
        <div class="quick-dur" id="newQuick">
          <button type="button" data-min="15">15</button>
          <button type="button" data-min="30">30</button>
          <button type="button" data-min="45">45</button>
          <button type="button" data-min="60">60</button>
          <button type="button" data-min="90">90</button>
        </div>
      </div>
      <div class="tag-picker" id="newTags"></div>
      <button class="primary-btn" id="btnAdd">添加到待办</button>
    </section>

    <section class="panel" id="poolPanel">
      <h2 class="panel-title">待办 <span class="count" id="poolCount">0</span>
        <button class="link-btn" id="btnAutoAll" title="按顺序把待办自动排入可用时间">自动排程</button>
      </h2>
      <div class="pool" id="pool"></div>
    </section>

    <section class="panel done-panel">
      <h2 class="panel-title">已完成 <span class="count" id="doneCount">0</span>
        <button class="link-btn" id="btnClearLog">清空</button>
      </h2>
      <div class="donelist" id="doneList"></div>
    </section>

  </aside>

  <!-- ─────────────── 右栏：日程表 ─────────────── -->
  <section class="col col-schedule">

    <div class="sched-head">
      <div class="datenav">
        <button class="nav-btn" id="prevDay" aria-label="前一天">‹</button>
        <div class="datenav-mid">
          <div class="dn-main" id="viewDate">—</div>
          <input type="date" id="datePick" class="dn-pick" aria-label="选择日期">
        </div>
        <button class="nav-btn" id="nextDay" aria-label="后一天">›</button>
        <button class="ghost-btn" id="btnToday">今天</button>
      </div>
      <div class="sched-tools">
        <div class="zoom" id="zoom">
          <button type="button" data-z="0">疏</button>
          <button type="button" data-z="1">中</button>
          <button type="button" data-z="2">密</button>
        </div>
        <button class="ghost-btn accent" id="btnReview">结算 <span class="badge" id="reviewBadge" hidden>0</span></button>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="availbar">
      <span class="ab-label">可用时间</span>
      <div class="ab-chips" id="slotChips"></div>
      <div class="ab-actions">
        <button class="ghost-btn" id="btnAddSlot">＋ 时间段</button>
        <button class="ghost-btn" id="btnCopyPrev" title="复制前一天的可用时间">沿用昨日</button>
      </div>
      <form class="slot-form" id="slotForm" hidden>
        <input type="time" id="slotStart" step="60" value="09:00">
        <span class="dash">—</span>
        <input type="time" id="slotEnd" step="60" value="12:00">
        <button type="submit" class="primary-btn small">加入</button>
        <div class="presets">
          <button type="button" data-s="09:00" data-e="12:00">上午</button>
          <button type="button" data-s="14:00" data-e="18:00">下午</button>
          <button type="button" data-s="19:00" data-e="22:00">晚间</button>
          <button type="button" data-s="08:00" data-e="22:00">全天</button>
        </div>
      </form>
    </div>

    <div class="timeline" id="timeline">
      <div class="tl-inner" id="tlInner">
        <div class="gutter" id="gutter"></div>
        <div class="surface" id="surface"></div>
      </div>
    </div>
    <p class="tl-hint">在时间轴空白处按住拖动＝刷出可用时间 · 把左侧任务拖进来＝排入日程 · 拖动色块＝调整时间</p>

  </section>
</main>

<!-- ─────────────── 任务编辑 / 拆分 ─────────────── -->
<dialog id="taskDialog" class="dlg">
  <form id="taskForm" method="dialog">
    <h3 class="dlg-title" id="dlgTitle">编辑任务</h3>

    <div class="field">
      <span class="lbl">名称</span>
      <input type="text" id="fTitle" class="txt" autocomplete="off">
    </div>

    <div class="field" id="fDurField">
      <span class="lbl">耗时</span>
      <div class="dur-block">
        <div class="dur-input">
          <input type="number" id="fH" min="0" max="23" step="1"><span class="unit">时</span>
          <input type="number" id="fM" min="0" max="59" step="1"><span class="unit">分</span>
        </div>
        <div class="quick-dur" id="fQuick">
          <button type="button" data-min="15">15</button>
          <button type="button" data-min="30">30</button>
          <button type="button" data-min="45">45</button>
          <button type="button" data-min="60">60</button>
          <button type="button" data-min="90">90</button>
          <button type="button" data-min="120">120</button>
        </div>
      </div>
    </div>

    <div class="field">
      <span class="lbl">标签</span>
      <div class="tag-picker" id="fTags"></div>
    </div>

    <div class="field">
      <span class="lbl">备注</span>
      <textarea id="fNote" class="txt" rows="2" placeholder="可留空"></textarea>
    </div>

    <div class="split" id="splitSection">
      <div class="split-head">
        <span class="split-title">拆分为子任务</span>
        <span class="split-sum" id="splitSum"></span>
      </div>
      <div class="split-list" id="splitList"></div>
      <button type="button" class="ghost-btn wide" id="addSub">＋ 添加子任务</button>
      <p class="split-note">拆分后，父任务不再单独排程，改为把各个子任务分别放进日程表。</p>
    </div>

    <footer class="dlg-foot">
      <button type="button" class="ghost-btn danger" id="btnDelTask">删除</button>
      <div class="spacer"></div>
      <button type="button" class="ghost-btn" id="btnCancel">取消</button>
      <button type="submit" class="primary-btn">保存</button>
    </footer>
  </form>
</dialog>

<!-- ─────────────── 结算 ─────────────── -->
<dialog id="reviewDialog" class="dlg">
  <div class="rv">
    <h3 class="dlg-title">结算 · 已过时的日程</h3>
    <p class="rv-sub">完成即从系统中删除；未完成则退回待办，由你重新分配。</p>
    <div class="rv-list" id="rvList"></div>
    <footer class="dlg-foot">
      <div class="spacer"></div>
      <button type="button" class="ghost-btn" id="rvClose">关闭</button>
    </footer>
  </div>
</dialog>

<!-- ─────────────── 导出文档 ─────────────── -->
<dialog id="exportDialog" class="dlg">
  <form id="exportForm" method="dialog">
    <h3 class="dlg-title">导出为文档</h3>

    <div class="field">
      <span class="lbl">范围</span>
      <div class="zoom wide" id="expRange">
        <button type="button" data-r="today">今天</button>
        <button type="button" data-r="week">本周</button>
        <button type="button" data-r="month">本月</button>
        <button type="button" data-r="all">全部</button>
        <button type="button" data-r="custom">自定义</button>
      </div>
    </div>

    <div class="field" id="expCustomField" hidden>
      <span class="lbl">日期</span>
      <div class="range-row">
        <input type="date" id="expStart">
        <span class="dash">—</span>
        <input type="date" id="expEnd">
      </div>
    </div>

    <div class="field">
      <span class="lbl">内容</span>
      <div class="expopts">
        <label class="chk"><input type="checkbox" id="expLog" checked> 包含已完成记录</label>
        <label class="chk"><input type="checkbox" id="expPending" checked> 附上未排程的待办</label>
      </div>
    </div>

    <p class="split-note" id="expSummary"></p>

    <footer class="dlg-foot">
      <div class="spacer"></div>
      <button type="button" class="ghost-btn" id="expCancel">取消</button>
      <button type="submit" class="primary-btn">生成文档</button>
    </footer>
  </form>
</dialog>

<!-- ─────────────── 账号 / 同步 ─────────────── -->
<dialog id="acctDialog" class="dlg">
  <form id="acctForm" method="dialog" novalidate>
    <h3 class="dlg-title" id="acctTitle">登录</h3>

    <div id="acctOut">
      <div class="zoom wide acct-tabs" id="acctTabs">
        <button type="button" data-m="in">登录</button>
        <button type="button" data-m="up">注册</button>
        <button type="button" data-m="reset">忘记密码</button>
      </div>
      <div class="field">
        <span class="lbl">邮箱</span>
        <input type="email" id="aEmail" class="txt" autocomplete="email" spellcheck="false">
      </div>
      <div class="field" id="aCodeField" hidden>
        <span class="lbl">验证码</span>
        <input type="text" id="aCode" class="txt" inputmode="numeric" autocomplete="one-time-code" maxlength="10">
      </div>
      <div class="field" id="aPwdField">
        <span class="lbl" id="aPwdLbl">密码</span>
        <input type="password" id="aPwd" class="txt" autocomplete="current-password">
      </div>
      <p class="split-note acct-note" id="acctNote"></p>
    </div>

    <div id="acctIn" hidden>
      <div class="field">
        <span class="lbl">账号</span>
        <div class="acct-val" id="aWho"></div>
      </div>
      <div class="field">
        <span class="lbl">同步</span>
        <div class="acct-val" id="aSync"></div>
      </div>
      <div class="acct-guest" id="aGuest" hidden>
        <span>本机还有未登录时记下的 <b id="aGuestN"></b>。</span>
        <button type="button" class="ghost-btn" id="aMerge">并入账号</button>
      </div>
      <label class="chk"><input type="checkbox" id="aWipe"> 退出时清除本机上这个账号的数据（公用电脑用）</label>
    </div>

    <footer class="dlg-foot">
      <button type="button" class="ghost-btn danger" id="aDelete" hidden>注销账号</button>
      <div class="spacer"></div>
      <button type="button" class="ghost-btn" id="aClose">关闭</button>
      <button type="button" class="ghost-btn" id="aOut" hidden>退出登录</button>
      <button type="button" class="ghost-btn" id="aSyncNow" hidden>立即同步</button>
      <button type="submit" class="primary-btn" id="aSubmit">登录</button>
    </footer>
  </form>
</dialog>

<!-- ─────────────── 导览 ─────────────── -->
<div class="tour" id="tour" hidden>
  <div class="tour-mask" id="tourMask"></div>
  <div class="tour-hole" id="tourHole"></div>
  <div class="tour-card" id="tourCard" role="dialog" aria-modal="true" aria-labelledby="tourTitle">
    <div class="tour-count" id="tourCount">1 / 1</div>
    <h3 class="tour-title" id="tourTitle">—</h3>
    <div class="tour-body" id="tourBody"></div>
    <footer class="tour-foot">
      <button type="button" class="tour-skip" id="tourSkip">跳过</button>
      <div class="tour-dots" id="tourDots"></div>
      <button type="button" class="ghost-btn" id="tourPrev">上一步</button>
      <button type="button" class="primary-btn small" id="tourNext">下一步</button>
    </footer>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
